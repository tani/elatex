name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ert:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ["29.1", "30.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Byte compile
        run: |
          emacs -Q --batch -L . -L test \
            -f batch-byte-compile \
            elatex-data.el elatex-string.el elatex-error.el elatex-box.el \
            elatex-lexer.el elatex-parser.el elatex-draw.el elatex.el \
            test/elatex-fixtures.el test/elatex-test.el \
            test/elatex-differential-test.el
      - name: Run ERT
        run: |
          emacs -Q --batch -L . -L test \
            -l test/elatex-test.el \
            -f ert-run-tests-batch-and-exit

  differential:
    needs: ert
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: "30.2"
      - name: Download pinned oracle source
        env:
          LIBTEXPRINTF_REVISION: 18977837b20649d56a651eb6bf846f1c914db77a
        run: |
          git init "${RUNNER_TEMP}/libtexprintf"
          git -C "${RUNNER_TEMP}/libtexprintf" remote add origin \
            https://github.com/bartp5/libtexprintf.git
          git -C "${RUNNER_TEMP}/libtexprintf" fetch --depth 1 \
            origin "${LIBTEXPRINTF_REVISION}"
          git -C "${RUNNER_TEMP}/libtexprintf" checkout --detach FETCH_HEAD
      - name: Install oracle build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool gawk
      - name: Build and test pinned oracle
        working-directory: ${{ runner.temp }}/libtexprintf
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          sh autogen.sh
          ./configure
          make -j2
          make check
      - name: Run differential ERT
        env:
          ELATEX_ORACLE: ${{ runner.temp }}/libtexprintf/src/utftex
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          emacs -Q --batch -L . -L test \
            -l test/elatex-differential-test.el \
            -f ert-run-tests-batch-and-exit
